version: 2
updates:
  # keeps the SHA-pinned actions in .github/workflows current: it opens a pull request when a newer release
  # appears and updates the SHA together with the "# vX.Y.Z" comment next to it
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(actions)"

  # git-cliff for the release notes (the only thing in .github/requirements-release.txt)
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(release)"

  # the dependencies in pyproject.toml and the pins in uv.lock
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"

  # the uv image the Dockerfile copies from, and the Python base image
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
