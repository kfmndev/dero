# Actions are pinned to the commit of a release (the comment names it), so a moved tag cannot change what runs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (Ruff, Pyrefly, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check dero tests
      - run: ruff check dero tests
      - run: pyrefly check
      - run: pytest -q

  static:
    name: Scripts and stylesheet (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: biomejs/setup-biome@77af1e9ce0cc32955e83b0c3e30c28ae3b81cab7 # v2.8.0
        with:
          version: 2.6.9
      - run: biome ci
