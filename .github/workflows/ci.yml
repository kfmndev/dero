name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (Ruff, Pyrefly, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check dero tests
      - run: ruff check dero tests
      - run: pyrefly check
      - run: pytest -q

  static:
    name: Scripts and stylesheet (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: biomejs/setup-biome@v2
        with:
          version: 2.6.9
      - run: biome ci
