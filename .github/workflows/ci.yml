# Actions are pinned to the commit of a release (the comment names it), so a moved tag cannot change what runs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# a newer push to the same branch or pull request makes the run of the older one obsolete
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (Ruff, Pyrefly, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
          activate-environment: true # the tools below run from the venv uv creates
          enable-cache: true
      - run: uv sync --locked # exactly the versions in uv.lock, dev tools included
      - run: ruff format --check dero tests
      - run: ruff check dero tests
      - run: pyrefly check
      - run: pytest -q

  static:
    name: Scripts and stylesheet (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: biomejs/setup-biome@77af1e9ce0cc32955e83b0c3e30c28ae3b81cab7 # v2.8.0
        with:
          version: 2.6.9
      - run: biome ci
