# A pushed tag v1.2.3 becomes a GitHub release. The tag must match VERSION in dero/version.py, and the notes are
# written from the conventional commits since the previous tag (cliff.toml). The Docker image is published by docker.yml.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the notes need the history back to the previous tag
      - name: The tag matches dero/version.py
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' dero/version.py)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION = \"$version\" in dero/version.py"
            exit 1
          fi
      - run: pip install git-cliff==2.14.2
      - run: git cliff --current --strip header > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md $flags
