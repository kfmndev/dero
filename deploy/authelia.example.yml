# Fragments for Authelia's configuration.yml (check against your Authelia version's docs).
access_control:
  default_policy: deny
  rules:
    - domain: s.example.com
      resources: ['^/_(/.*)?$']
      policy: one_factor
      subject: ['group:dero-users', 'group:dero-admins']

