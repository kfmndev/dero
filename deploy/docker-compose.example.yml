# Runs the published image (built by CI, see .github/workflows/docker.yml).
# Put it next to your .env as docker-compose.yml. To build from source instead, use docker-compose.build.example.yml.
services:
  dero:
    # Pin a release (e.g. :0.1.0) instead of :latest if you want to update on purpose.
    image: ghcr.io/kfmndev/dero:latest
    restart: unless-stopped
    environment:
      SECRET_KEY: "${SECRET_KEY:?generate one with openssl rand -hex 32}"
      AUTH_MODE: ${AUTH_MODE:-basic}   # basic | proxy (SSO headers) | none
      PROXY_SECRET: ${PROXY_SECRET:-}  # only used with AUTH_MODE=proxy
      BASE_URL: ${BASE_URL:-}          # e.g. https://s.example.com (shown and copied in the admin UI)
      FALLBACK_URL: ${FALLBACK_URL:-}   # e.g. https://kfmn.it/rickroll (editable later in the UI)
    volumes:
      - dero-data:/data
    # Do NOT publish the port; only Caddy (same docker network) should reach it.
    expose: ["8000"]
volumes:
  dero-data:
