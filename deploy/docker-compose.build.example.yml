# Builds the image from this checkout instead of pulling it (see docker-compose.example.yml).
# Run it from the repository root: docker compose -f deploy/docker-compose.build.example.yml --env-file .env up -d --build
# (DERO_COMMIT=$(git rev-parse HEAD) in front shows the commit in the footer.)
services:
  dero:
    build:
      context: ..
      args:
        DERO_COMMIT: ${DERO_COMMIT:-}
    restart: unless-stopped
    environment:
      SECRET_KEY: "${SECRET_KEY:?generate one with openssl rand -hex 32}"
      AUTH_MODE: ${AUTH_MODE:-basic}   # basic | proxy (SSO headers) | none
      PROXY_SECRET: ${PROXY_SECRET:-}  # only used with AUTH_MODE=proxy
      BASE_URL: ${BASE_URL:-}          # e.g. https://s.example.com (shown and copied in the admin UI)
      FALLBACK_URL: ${FALLBACK_URL:-}   # e.g. https://kfmn.it/rickroll (editable later in the UI)
    volumes:
      - dero-data:/data
    # Do NOT publish the port; only Caddy (same docker network) should reach it.
    expose: ["8000"]
volumes:
  dero-data:
