[project]
name = "dero"
description = "A privacy-first, self-hosted URL shortener"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
# keep in step with VERSION in dero/version.py (the release workflow checks both against the tag)
version = "0.1.0"
# what the app imports itself; the rest (Jinja2, click, blinker) comes along with Flask. uv.lock pins every version.
dependencies = [
    "Flask>=3.1.3",
    "gunicorn>=27.0.1",
    "itsdangerous>=2.2.0",
    "MarkupSafe>=3.0.4",
    "regex>=2026.11.23",
    "Werkzeug>=3.1.9",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "pyrefly>=1.5.0",
    "types-regex>=2026.11.19.20261122",
]

[tool.uv]
# an application, not a library: nothing gets built or installed, only its dependencies
package = false

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = [".venv"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import order, D1: a docstring on every public module, class and function
select = ["E", "W", "F", "I", "D1"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]            # test names describe the tests
"dero/admin/__init__.py" = ["E402", "F401"]   # the route modules are imported last, on purpose

[tool.pyrefly]
# the app is checked; the tests are left out for now
project-includes = ["dero"]

[tool.pytest.ini_options]
# `pytest` (unlike `python -m pytest`) does not put the project folder on the import path
pythonpath = ["."]
testpaths = ["tests"]
